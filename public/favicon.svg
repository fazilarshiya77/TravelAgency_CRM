<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0072ff"/>
      <stop offset="100%" stop-color="#0033cc"/>
    </linearGradient>
    <linearGradient id="grad-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0055ff"/>
      <stop offset="100%" stop-color="#001188"/>
    </linearGradient>
    <linearGradient id="grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3399ff"/>
      <stop offset="100%" stop-color="#0055ff"/>
    </linearGradient>
  </defs>

  <g transform="translate(70, 70) scale(0.75)">
    <!-- Diagonal -->
    <polygon points="120,40 400,400 300,440 20,80" fill="url(#grad-main)"/>
    
    <!-- Left Pillar -->
    <polygon points="20,400 20,80 120,40 120,360" fill="url(#grad-dark)"/>
    <polygon points="20,80 120,40 160,90 60,130" fill="url(#grad-light)"/>
    
    <!-- Right Pillar -->
    <polygon points="400,400 400,80 300,120 300,440" fill="url(#grad-dark)"/>
    <polygon points="300,120 400,80 440,130 340,170" fill="url(#grad-light)"/>
  </g>
</svg>